[package]
name = "kvas_editor"
version.workspace = true
edition.workspace = true

[dependencies]
kvas_ecs.workspace = true
kvas_engine.workspace = true
kvas_render.workspace = true
kvas_audio.workspace = true
glam.workspace = true
serde_json.workspace = true
serde.workspace = true
eframe.workspace = true
egui_dock = { workspace = true, features = ["serde"] }
rfd = "0.17"
image.workspace = true
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
